<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bautapixel AB</title>
<meta name="description" content="Bautapixel AB arbetar med digitala lösningar och gränssnitt för människor. Organisationsnummer 559501-1528.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">

<style>
  :root {
    color-scheme: light dark;
    --fg: #16161a;
    --muted: #6b6b73;
    --rule: rgba(22, 22, 26, 0.12);
    --page-bg:
      radial-gradient(1100px 620px at 50% -10%, rgba(255, 255, 255, 0.95), transparent 62%),
      linear-gradient(158deg, #f7f4f0 0%, #edeef3 52%, #e2e7f0 100%);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #ededf0;
      --muted: #9a9aa4;
      --rule: rgba(237, 237, 240, 0.14);
      --page-bg:
        radial-gradient(1100px 620px at 50% -10%, rgba(78, 90, 120, 0.32), transparent 62%),
        linear-gradient(158deg, #15151a 0%, #111318 52%, #0b0d12 100%);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    background: var(--page-bg) fixed;
    color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 2rem 1.5rem;
  }

  main {
    flex: 1 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 3rem 0;
  }

  h1 {
    font-family: "Pixelify Sans", "Courier New", monospace;
    font-weight: 700;
    /* Stepped sizes, not a fluid clamp: a pixel typeface only stays crisp at
       whole-number sizes, so fractional vw values are avoided on purpose. */
    font-size: 40px;
    letter-spacing: 0;
    line-height: 1.1;
    margin: 0;
  }

  @media (min-width: 30rem) {
    h1 { font-size: 56px; }
  }

  @media (min-width: 48rem) {
    h1 { font-size: 72px; }
  }

  main p {
    max-width: 30rem;
    margin: 1.75rem 0 0;
    font-size: 1.0625rem;
    color: var(--muted);
    text-wrap: balance;
  }

  footer {
    flex: 0 0 auto;
    padding-top: 1.25rem;
    border-top: 1px solid var(--rule);
    font-size: 0.8125rem;
    color: var(--muted);
  }

  footer ul {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.35rem 1.25rem;
    margin: 0;
    padding: 0;
  }

  footer .label {
    color: var(--fg);
    opacity: 0.5;
  }
</style>
</head>
<body>
  <main>
    <h1>Bautapixel AB</h1>
    <p>
      Vi arbetar med digitala lösningar och gränssnitt —
      byggda för människorna som ska använda dem.
    </p>
  </main>

  <footer>
    <ul>
      <li><span class="label">Org.nr</span> 559501-1528</li>
      <li><span class="label">Momsreg.nr</span> SE559501152801</li>
      <li>Registrerad för moms</li>
      <li>Godkänd för F-skatt</li>
      <li>Sverige</li>
    </ul>
  </footer>
</body>
</html>
